name: Haize V7 - Regressao e seguranca

on:
  push:
    branches:
      - estabilizacao-v70-20261106
  pull_request:
    branches:
      - central-servicos-notificacoes-2026

permissions:
  contents: read

concurrency:
  group: haize-v70-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Testes Python (sem producao)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias de backend
        run: python -m pip install -r backend/requirements.txt
      - name: Executar todos os testes offline
        env:
          DATABASE_URL: 'sqlite://'
          AUTH_SECRET_KEY: 'apenas-para-ci-sem-acesso-a-producao-2026'
          ENABLE_CHECKLIST_EMAILS: 'false'
          GAS_WEB_APP_URL: ''
          HAIZE_SECRET: ''
          AUTOMATION_SECRET: ''
          FRONTEND_PUBLIC_URL: 'http://127.0.0.1:5173'
        run: python -m unittest discover -s testes_servicos -p 'test_*.py' -v

  frontend:
    name: Build e lint React
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias reproduziveis
        run: npm ci
        working-directory: frontend
      - name: Compilar frontend
        run: npm run build
        working-directory: frontend
      - name: Verificar lint
        run: npm run lint
        working-directory: frontend

  seguranca_git:
    name: Bloquear novos arquivos sensiveis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Auditar arquivos rastreados sem abrir conteudo
        run: python3 scripts/verificar_artefatos_git_v70.py

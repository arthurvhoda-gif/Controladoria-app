name: Haize V7.1 - Atualizacao unica do lockfile

on:
  push:
    branches:
      - seguranca-v71-20261106
    paths:
      - .github/workflows/v71-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    name: Atualizar lockfile de dependencias sem force
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar lockfile preservando versões declaradas
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          # Corrige dependencias transitivas somente em versões compativeis.
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Verificar que somente o lockfile foi modificado
        run: |
          git diff --name-only
          if git diff --name-only | grep -v '^frontend/package-lock.json$'; then
            echo "::error::Atualizacao tocou outro arquivo alem do lockfile."
            exit 1
          fi
      - name: Gravar lockfile na branch V7.1 isolada
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "V7.1: atualiza lockfile npm sem alteracoes forcadas"
            git push origin HEAD:seguranca-v71-20261106
          fi
